version: "2"

run:
  timeout: 5m

linters:
  # "standard" = errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - errorlint   # correct error wrapping/comparison
    - gosec       # security checks (this is a security tool)
    - misspell
    - noctx       # HTTP requests must carry a context
    - revive
    - unconvert
    - unparam
  exclusions:
    rules:
      # Tests may ignore a few things that production code must not.
      - path: _test\.go
        linters:
          - gosec
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/netseven/infra-probe
